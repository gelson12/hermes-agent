model:
  # PRIMARY: Groq Mixtral - direct API (cost-efficient, ultra-fast inference)
  default: "mixtral-8x7b-32768"
  provider: "groq"

  # Unified fallback chain - automatic escalation on rate limit/unavailability
  fallback_chain:
    - "mixtral-8x7b-32768"                           # Tier 1: Primary (direct Groq API)
    - "openrouter/google/gemini-2.5-flash:free"      # Tier 2: Free tier via OpenRouter (no billing)
    - "sambanova/deepseek-ai/DeepSeek-R1"            # Tier 3: Reasoning capability via OpenRouter
    - "ollama/llama3"                                 # Tier 4: Offline local fallback

  # Routing: Task-specific model selection
  routing:
    voice:
      primary: "mixtral-8x7b-32768"
      backup: "openrouter/google/gemini-2.5-flash:free"
      fallback: "sambanova/deepseek-ai/DeepSeek-R1"
      tertiary: "ollama/llama3"

    chat:
      primary: "mixtral-8x7b-32768"
      backup: "openrouter/google/gemini-2.5-flash:free"
      fallback: "sambanova/deepseek-ai/DeepSeek-R1"

    reasoning:
      primary: "sambanova/deepseek-ai/DeepSeek-R1"
      backup: "mixtral-8x7b-32768"
      fallback: "openrouter/google/gemini-2.5-flash:free"

    coding:
      primary: "sambanova/deepseek-ai/DeepSeek-R1"
      backup: "mixtral-8x7b-32768"
      fallback: "openrouter/google/gemini-2.5-flash:free"

# API Server (OpenAI-compatible streaming)
api_server:
  enabled: true
  host: "0.0.0.0"
  port: 8642
  # Streaming configuration - preserves unified OpenAI-compatible message chunks
  streaming:
    enabled: true
    chunk_format: "openai-compatible"
    buffer_size: 1024

logging:
  level: "info"
  format: "json"
