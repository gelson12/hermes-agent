model:
  # Gemini PRIMARY (fast + free tier). When Gemini is unavailable (e.g. the current
  # billing suspension -> 403), the fallback chain below takes over (Haiku -> DeepSeek)
  # so the brain stays alive, and Gemini auto-resumes as primary the moment its billing
  # is restored. INV-03/04/09 Gemini-only lock is relaxed (HERMES_ENFORCE_GEMINI_ONLY=1
  # to re-impose it).
  default: "gemini-2.5-flash"
  provider: "gemini"

# Vault memory provider (Obsidian Vault on Railway) — activates the
# self-improvement loop: cross-session recall before each turn + Q+A
# write-back after each turn.  Requires VAULT_SECRET (super-agent /memory)
# and/or OBSIDIAN_MIND_URL (obsidian-mind).  Either backend suffices;
# super-agent is currently off for cost so obsidian-mind is the primary.
memory:
  provider: "vault"

# Auxiliary task routing — per-task provider/model overrides for the
# agentic layers shipped in the Tier 1+2 upgrade (planner, reflector,
# distiller, prompt_evolver).  Read by `auxiliary_client._resolve_task_provider_model`
# at call time.  Main user-facing chat still uses the model.default above
# (Gemini Flash); this section only affects the behind-the-scenes layers.
#
# Direct providers (Groq, Gemini) for high-volume tasks; OpenRouter as the
# long-tail fallback (see fallback_providers below).
auxiliary:
  # ALL agentic layers run on DeepSeek so Hermes's FULL functionality works on the funded
  # provider regardless of Gemini's state — no Google bank-card dependency. DeepSeek is
  # native + funded. If Gemini is later the MAIN chat, these stay on DeepSeek (reliable,
  # cheap). This is what makes "all Hermes features work" without Gemini.
  planner:
    provider: deepseek
    model: deepseek-chat

  reflector:
    provider: deepseek
    model: deepseek-chat

  distiller:
    provider: deepseek
    model: deepseek-chat

  # Prompt evolver: rare, never on the voice hot path. deepseek-chat keeps it on one funded
  # provider (use deepseek-reasoner here if you want stronger reasoning + don't mind slower).
  prompt_evolver:
    provider: deepseek
    model: deepseek-chat

# Fallback chain — when an auxiliary call's primary provider rate-limits or
# errors, the agent falls through to this single fallback before giving up.
# fallback_model MUST be a dict with provider + model (not a string) per
# Hermes config schema (see hermes_cli/config.py:3082).  Gemini 2.5 Flash
# is the universally-available fallback because GEMINI_API_KEY is required
# for the main agent path anyway.
# DeepSeek is the resilient fallback: when Gemini struggles (e.g. the 403
# PERMISSION_DENIED after a billing suspension) the agent falls through to
# DeepSeek-chat — native provider, DEEPSEEK_API_KEY already set, reasoning on par
# with Gemini-Flash, and cheap. Gemini stays PRIMARY (model.provider above), so the
# moment Gemini billing is restored it leads again with DeepSeek as the safety net.
# Fallback chain: Gemini (primary above) -> Haiku 4.5 -> DeepSeek. Whichever provider is
# reachable answers, so a single outage never mutes the brain. fallback_model = DeepSeek
# keeps the auxiliary layers (planner/reflector/distiller/prompt-evolver) working when
# THEIR own provider errors, so Hermes's full agentic functionality is preserved.
fallback_providers:
  - provider: anthropic
    model: claude-haiku-4-5-20251001
  - provider: deepseek
    model: deepseek-chat
fallback_model:
  provider: deepseek
  model: deepseek-chat

# Historical Execution Invariant Specification (2026-05-17, relaxed 2026-05-25):
# - The invariants below were imposed when Hermes was deployed as a strict
#   single-path service.  They are no longer enforced because the agentic
#   upgrade (planner + reflector + multi-LLM routing) needs tiered model
#   selection.  Routing is gated entirely by env vars:
#     HERMES_VAULT_ROUTING_ENABLED   default: false  — flip to true to enable
#     VAULT_ROUTE_CHEAP_MODEL        e.g. groq/llama-3.3-70b-versatile
#     VAULT_ROUTE_MID_MODEL          e.g. gemini-2.5-flash (default)
#     VAULT_ROUTE_BIG_MODEL          e.g. gemini-2.5-pro
# - Setting HERMES_VAULT_ROUTING_ENABLED=false restores Gemini-only behaviour
#   (the default model from this file is always used).
#
# Original invariants (now PREFERENCES, not hard constraints):
# - INV-04 (was): LLM provider MUST be "gemini"   → now: default provider is gemini
# - INV-05 (was): LLM model MUST be "gemini-2.5-flash" → now: default model
# - INV-08: fallback_providers MUST be empty (or omitted) — still true here
# - INV-09: OpenRouter is never contacted — relaxable via VAULT_ROUTE_*_MODEL
# - INV-10: OpenAI API is never contacted — relaxable via VAULT_ROUTE_*_MODEL
# - INV-11: Anthropic API is never contacted — relaxable via VAULT_ROUTE_*_MODEL
