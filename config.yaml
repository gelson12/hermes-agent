model:
  default: "gemini-2.5-flash"
  provider: "gemini"

# Vault memory provider (Obsidian Vault on Railway) — activates the
# self-improvement loop: cross-session recall before each turn + Q+A
# write-back after each turn.  Requires VAULT_SECRET env var.  Gracefully
# no-ops when the secret is missing, so this config is safe even on dev
# boxes without vault access.  Compatible with the Gemini-only invariants
# below because routing is purely read-side here (recall enriches context;
# model selection stays gated by HERMES_VAULT_ROUTING_ENABLED env var).
memory:
  provider: "vault"

# CRITICAL: No fallback providers. Gemini-only execution (enforced).
# HERMES_HOME now set to /opt/hermes so config.yaml is properly located.
# If this deployment had an older config with fallback chains or
# anthropic/claude-opus-4.6, this override ensures they are completely disabled.
fallback_providers: []
fallback_model: null

# Execution Invariant Specification (2026-05-17):
# - INV-04: LLM provider MUST be "gemini"
# - INV-05: LLM model MUST be "gemini-2.5-flash"
# - INV-08: fallback_providers MUST be empty (or omitted)
# - INV-09: OpenRouter is never contacted
# - INV-10: OpenAI API is never contacted
# - INV-11: Anthropic API is never contacted
#
# This configuration enforces a single deterministic path:
#   Hermes → generativelanguage.googleapis.com → Gemini 2.5 Flash
