model:
  default: "gemini-2.5-flash"
  provider: "gemini"

# Vault memory provider (Obsidian Vault on Railway) — activates the
# self-improvement loop: cross-session recall before each turn + Q+A
# write-back after each turn.  Requires VAULT_SECRET (super-agent /memory)
# and/or OBSIDIAN_MIND_URL (obsidian-mind).  Either backend suffices;
# super-agent is currently off for cost so obsidian-mind is the primary.
memory:
  provider: "vault"

# Auxiliary task routing — per-task provider/model overrides for the
# agentic layers shipped in the Tier 1+2 upgrade (planner, reflector,
# distiller, prompt_evolver).  Read by `auxiliary_client._resolve_task_provider_model`
# at call time.  Main user-facing chat still uses the model.default above
# (Gemini Flash); this section only affects the behind-the-scenes layers.
#
# Direct providers (Groq, Gemini) for high-volume tasks; OpenRouter as the
# long-tail fallback (see fallback_providers below).
auxiliary:
  # Planner subtask execution + decomposition: high-volume, cheap, fast.
  # Groq llama-3.3-70b is ~3x faster than Gemini Flash and free up to ~6k tok/min.
  planner:
    provider: groq
    model: llama-3.3-70b-versatile

  # Reflector: structured JSON output, fires every turn — needs fast + reliable.
  # Same model as planner so the resolved client can be cache-shared.
  reflector:
    provider: groq
    model: llama-3.3-70b-versatile

  # Distiller: writes SKILL.md prose, fires only after successful multi-step
  # runs (low volume).  Gemini Flash keeps the prose register consistent with
  # the rest of the system.
  distiller:
    provider: gemini
    model: gemini-2.5-flash

  # Prompt evolver: rare, important — wants the best reasoning available.
  prompt_evolver:
    provider: gemini
    model: gemini-2.5-pro

# Fallback chain — when a per-task provider rate-limits or 429s, the
# auxiliary client falls through to these in order before giving up.
# OpenRouter accepts free-tier model strings like
# meta-llama/llama-3.3-70b-instruct:free, so this is the long-tail catch.
fallback_providers:
  - openrouter
fallback_model: "meta-llama/llama-3.3-70b-instruct:free"

# Historical Execution Invariant Specification (2026-05-17, relaxed 2026-05-25):
# - The invariants below were imposed when Hermes was deployed as a strict
#   single-path service.  They are no longer enforced because the agentic
#   upgrade (planner + reflector + multi-LLM routing) needs tiered model
#   selection.  Routing is gated entirely by env vars:
#     HERMES_VAULT_ROUTING_ENABLED   default: false  — flip to true to enable
#     VAULT_ROUTE_CHEAP_MODEL        e.g. groq/llama-3.3-70b-versatile
#     VAULT_ROUTE_MID_MODEL          e.g. gemini-2.5-flash (default)
#     VAULT_ROUTE_BIG_MODEL          e.g. gemini-2.5-pro
# - Setting HERMES_VAULT_ROUTING_ENABLED=false restores Gemini-only behaviour
#   (the default model from this file is always used).
#
# Original invariants (now PREFERENCES, not hard constraints):
# - INV-04 (was): LLM provider MUST be "gemini"   → now: default provider is gemini
# - INV-05 (was): LLM model MUST be "gemini-2.5-flash" → now: default model
# - INV-08: fallback_providers MUST be empty (or omitted) — still true here
# - INV-09: OpenRouter is never contacted — relaxable via VAULT_ROUTE_*_MODEL
# - INV-10: OpenAI API is never contacted — relaxable via VAULT_ROUTE_*_MODEL
# - INV-11: Anthropic API is never contacted — relaxable via VAULT_ROUTE_*_MODEL
